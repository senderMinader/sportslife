<div class="app-shell">
  <div class="page-wrap">
    <div class="top-rainbow-bar"></div>

    <header class="app-topbar">
      <a routerLink="/tournaments" class="brand">
        <span class="brand-mark"></span>
        <span>SPORTSLIFE</span>
      </a>

      <div class="topbar-actions">
        @if (authService.isAuthenticated()) {
          <a routerLink="/tournaments/create" class="btn-primary">Créer un tournoi</a>
          <button type="button" class="btn-secondary" (click)="logout()">
            Déconnexion
          </button>
        } @else {
          <a routerLink="/login" class="btn-primary">Connexion admin</a>
        }
      </div>
    </header>

    <router-outlet />
  </div>
</div>
