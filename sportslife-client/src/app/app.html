<div class="app-shell">
  <div class="top-rainbow-bar"></div>

    <header class="app-topbar">
      <a href="/tournaments" class="brand">
        <!-- <span class="brand-mark"></span>
        <span>SPORTSLIFE</span> -->
        <svg width="300" height="68" viewBox="0 0 300 68" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="34" cy="34" r="28" fill="#7c3aed"/>
          <path d="M18 38 Q24 18 34 26 Q42 34 50 20" stroke="white" stroke-width="3.5" stroke-linecap="round" fill="none"/>
          <circle cx="50" cy="20" r="5" fill="white"/>
          <circle cx="18" cy="38" r="3.5" fill="white" opacity="0.7"/>
          <text x="72" y="28" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#0f172a" letter-spacing="-0.5">SPORTS</text>
          <text x="72" y="54" font-family="system-ui, sans-serif" font-size="24" font-weight="300" fill="#7c3aed" letter-spacing="5">LIFE</text>
        </svg>
      </a>

      <div class="topbar-actions">
        @if (authService.isAuthenticated()) {
          <button type="button" [routerLink]="['/tournaments', 'create']" class="btn-primary">Créer un tournoi</button>
          <button type="button" class="btn-secondary" (click)="logout()">
            Déconnexion
          </button>
        } @else {
          <button type="button" [routerLink]="['/login']" class="btn-primary"> Connexion administrateur </button>
        }
      </div>
    </header>

    <router-outlet />
</div>
