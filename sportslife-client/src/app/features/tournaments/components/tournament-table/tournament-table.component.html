<div class="card">
        @if (loading()) {
    <mat-progress-bar mode="indeterminate" />
  }

  <table mat-table [dataSource]="tournaments()" class="tournament-table">

    <!-- Colonne Name -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Nom</th>
      <td mat-cell *matCellDef="let row">{{ row.name }}</td>
    </ng-container>

    <!-- Colonne Type -->
    <ng-container matColumnDef="type">
      <th mat-header-cell *matHeaderCellDef>Type</th>
      <td mat-cell *matCellDef="let row">{{ row.type }}</td>
    </ng-container>

    <!-- Colonne Status -->
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Statut</th>
      <td mat-cell *matCellDef="let row">
        <span [attr.data-status]="row.status" class="status-chip">
          {{ row.status }}
        </span>
      </td>
    </ng-container>

    <!-- Colonne Participants -->
    <ng-container matColumnDef="participantsCount">
      <th mat-header-cell *matHeaderCellDef>Participants</th>
      <td mat-cell *matCellDef="let row">{{ row.participantsCount }}</td>
    </ng-container>

    <!-- Colonne Date -->
    <ng-container matColumnDef="startedAt">
      <th mat-header-cell *matHeaderCellDef>Date</th>
      <td mat-cell *matCellDef="let row">
        {{ row.startedAt ? (row.startedAt | date: 'dd/MM/yyyy') : 'En attente' }}
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr
      mat-row
      *matRowDef="let row; columns: displayedColumns"
      [routerLink]="['/tournaments', row._id]"
      class="tournament-row"
    ></tr>

    <!-- Empty state -->
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell empty-state" [colSpan]="displayedColumns.length">
        Aucun tournoi trouvé.
      </td>
    </tr>

  </table>

  <mat-paginator
    [length]="totalItems()"
    [pageSize]="pageSize()"
    [pageIndex]="pageIndex()"
    [pageSizeOptions]="[5, 10, 25]"
    showFirstLastButtons
    (page)="onPageChange($event)"
  />
</div>
